# Netlify: builds the React app in client/. Security headers live in client/public/_headers,
# deep links (/login/student, /admin …) in client/public/_redirects.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under Site configuration → Environment variables.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Demo phase: keep the placeholder site out of Google. Remove this block at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
